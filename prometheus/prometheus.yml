global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "order_service"
    static_configs:
      - targets: ["order_service:8000"]

  - job_name: "inventory_service"
    static_configs:
      - targets: ["inventory_service:8001"]

  - job_name: "fraud_payment_service"
    static_configs:
      - targets: ["fraud_payment_service:8002"]