groups:
- name: inventory-alerts
  rules:

  - alert: InventoryReservationFailureRateHigh
    expr: |
      (
        sum(rate(inventory_reservation_failures[5m]))
        /
        sum(rate(inventory_reservations_total[5m]))
      ) > 0.05
      and
      sum(rate(inventory_reservations_total[5m])) > 0
    for: 5m
    labels:
      severity: warning
      service: inventory_service
    annotations:
      summary: "Inventory reservation failure rate above 5%"
      description: "More than 5% of inventory reservation attempts have failed over the last 5 minutes."

  - alert: InventoryReservationLatencyP95High
    expr: |
      histogram_quantile(
        0.95,
        sum by (le) (
          rate(inventory_reservation_duration_seconds_bucket[5m])
        )
      ) > 5
    for: 5m
    labels:
      severity: warning
      service: inventory_service
    annotations:
      summary: "Inventory reservation latency P95 above 5s"
      description: "The 95th percentile of inventory reservation latency has been above 5 seconds for more than 5 minutes."

  - alert: InventoryReservationLatencyP99High
    expr: |
      histogram_quantile(
        0.99,
        sum by (le) (
          rate(inventory_reservation_duration_seconds_bucket[5m])
        )
      ) > 5
    for: 5m
    labels:
      severity: critical
      service: inventory_service
    annotations:
      summary: "Inventory reservation latency P99 above 5s"
      description: "The 99th percentile of inventory reservation latency has been above 5 seconds for more than 5 minutes."

  - alert: InventoryServiceKafkaConsumerLagHigh
    expr: kafka_consumer_lag{service="inventory_service"} > 1000
    for: 5m
    labels:
      severity: critical
      service: inventory_service
    annotations:
      summary: "Kafka consumer lag is high for inventory_service"
      description: "Kafka consumer lag for inventory_service has exceeded 1000 messages for more than 5 minutes."