groups:
- name: order-service-alerts
  rules:

  - alert: OrderProcessingLatencyP95High
    expr: |
      histogram_quantile(
        0.95,
        sum by (le) (
          rate(order_processing_duration_seconds_bucket[5m])
        )
      ) > 10
    for: 5m
    labels:
      severity: warning
      service: order-service
    annotations:
      summary: "Order processing latency P95 above 10s"
      description: "The 95th percentile of order processing latency has been above 10 seconds for more than 5 minutes."

  - alert: OrderProcessingLatencyP99High
    expr: |
      histogram_quantile(
        0.99,
        sum by (le) (
          rate(order_processing_duration_seconds_bucket[5m])
        )
      ) > 10
    for: 5m
    labels:
      severity: critical
      service: order-service
    annotations:
      summary: "Order processing latency P99 above 10s"
      description: "The 99th percentile of order processing latency has been above 10 seconds for more than 5 minutes."

  - alert: OrderServiceKafkaConsumerLagHigh
    expr: kafka_consumer_lag{service="order-service"} > 1000
    for: 5m
    labels:
      severity: critical
      service: order-service
    annotations:
      summary: "Kafka consumer lag is high for order-service"
      description: "Kafka consumer lag for order-service has exceeded 1000 messages for more than 5 minutes."