groups:
- name: payment-and-fraud-alerts
  rules:

  - alert: PaymentSuccessRateLow
    expr: |
      (
        sum(rate(payment_attempts_total[5m]))
        -
        sum(rate(payment_failures_total[5m]))
      )
      /
      sum(rate(payment_attempts_total[5m]))
      < 0.95
      and
      sum(rate(payment_attempts_total[5m])) > 0
    for: 5m
    labels:
      severity: critical
      service: fraud-payment-service
    annotations:
      summary: "Payment success rate below 95%"
      description: "Payment success rate has remained below 95% for more than 5 minutes."

  - alert: FraudBlockRateHigh
    expr: |
      (
        sum(rate(fraud_decisions_total{decision="BLOCK"}[5m]))
        /
        sum(rate(fraud_decisions_total[5m]))
      ) > 0.10
      and
      sum(rate(fraud_decisions_total[5m])) > 0
    for: 5m
    labels:
      severity: warning
      service: fraud-payment-service
    annotations:
      summary: "High fraud block rate"
      description: "More than 10% of transactions are being blocked by fraud checks."

  - alert: RefundRateHigh
    expr: |
      (
        sum(rate(payment_refunds_total[5m]))
        /
        (
          sum(rate(payment_attempts_total[5m]))
          -
          sum(rate(payment_failures_total[5m]))
        )
      ) > 0.02
      and
      (
        sum(rate(payment_attempts_total[5m]))
        -
        sum(rate(payment_failures_total[5m]))
      ) > 0
    for: 5m
    labels:
      severity: warning
      service: fraud-payment-service
    annotations:
      summary: "Refund rate higher than 2%"
      description: "More than 2% of successful payments are being refunded over the last 5 minutes."

  - alert: FraudPaymentServiceKafkaConsumerLagHigh
    expr: kafka_consumer_lag{service="fraud-payment-service"} > 1000
    for: 5m
    labels:
      severity: critical
      service: fraud-payment-service
    annotations:
      summary: "Kafka consumer lag is high for fraud-payment-service"
      description: "Kafka consumer lag has exceeded 1000 messages for more than 5 minutes."