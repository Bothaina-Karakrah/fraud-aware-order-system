"""
DOCKER COMPOSE INFRASTRUCTURE
=============================
Complete microservices stack for Fraud-Aware Order System

ARCHITECTURE:
┌─────────────────┐        ┌──────────────────┐        ┌─────────────────┐
│ Order Service   │───┐    │ Fraud & Payment  │    ┌───│ Inventory       │
│ (Port 8000)     │   │    │ Service          │    │   │ Service         │
└─────────────────┘   │    │ (Port 8002)      │    │   │ (Port 8001)     │
       │              │    └──────────────────┘    │   └─────────────────┘
       │              └────────┬─────────────────┬─┘
       │                       │                 │
       └───────────────────────┼─────────────────┘
                      (Kafka Message Bus)
                               │
           ┌───────────────────┴───────────────────┐
           │                                       │
      ┌────▼──────┐    ┌─────────────┐    ┌──────▼────┐
      │ Zookeeper │───▶│   Kafka     │    │ Prometheus│
      │           │    │   (9092)    │    │ (9090)    │
      └───────────┘    └─────────────┘    └───────────┘
           │
     ┌─────┴─────┬─────────────┬──────────────┐
     │           │             │              │
┌────▼──┐  ┌────▼──┐  ┌──────▼───┐  ┌──────▼───┐
│Order  │  │Payment│  │Inventory │  │Prometheus│
│ DB    │  │ DB    │  │   DB     │  │   Data   │
└───────┘  └───────┘  └──────────┘  └──────────┘

SERVICES:
• 3x PostgreSQL databases (isolated per service)
• Kafka + Zookeeper (event-driven communication)
• 3x FastAPI microservices
• Prometheus (metrics & monitoring)

TO RUN:
  docker-compose up --build          # Start all services
  docker-compose logs -f             # View all logs
  docker-compose down -v             # Stop and remove volumes
"""

version: '3.8'

services:
  # ===============================
  # MICROSERVICES DATABASES
  # ===============================
  # Each service has its own database following microservices pattern
  # Credentials: user / pass (NOT for production!)

  order-db:
    image: postgres:15
    container_name: order-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orders"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15
    container_name: payment-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===============================
  # MESSAGE BROKER (Kafka Stack)
  # ===============================
  # Zookeeper manages Kafka cluster coordination
  # Kafka acts as event bus for inter-service communication

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ===============================
  # MICROSERVICES (FastAPI Apps)
  # ===============================

  order_service:
    build: order_service
    container_name: order_service
    environment:
      DATABASE_URL: postgresql://user:pass@order-db:5432/orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"  # REST API endpoint
    volumes:
      - ./logs/order_service:/app/logs  # Log persistence
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fraud_payment_service:
    build: ./fraud_payment_service
    container_name: fraud_payment_service
    environment:
      DATABASE_URL: postgresql://user:pass@payment-db:5432/payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8000"  # REST API endpoint
    volumes:
      - ./logs/fraud_payment_service:/app/logs
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory_service:
    build: ./inventory_service
    container_name: inventory_service
    environment:
      DATABASE_URL: postgresql://user:pass@inventory-db:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8000"  # REST API endpoint
    volumes:
      - ./logs/inventory_service:/app/logs
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ===============================
  # MONITORING
  # ===============================
  # Prometheus scrapes /metrics endpoints from all services

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - order_service
      - fraud_payment_service
      - inventory_service

# ===============================
# NAMED VOLUMES (Data Persistence)
# ===============================
volumes:
  order-db-data:       # Order Service database storage
  payment-db-data:     # Fraud & Payment Service database storage
  inventory-db-data:   # Inventory Service database storage
  prometheus-data:     # Prometheus time-series data storage
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8000"
    volumes:
      - ./logs/fraud_payment_service:/app/logs
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory_service:
    build: ./inventory_service
    container_name: inventory_service
    environment:
      DATABASE_URL: postgresql://user:pass@inventory-db:5432/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8001:8000"
    volumes:
      - ./logs/inventory_service:/app/logs
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # -------------------------------
  # Prometheus
  # -------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - order_service
      - fraud_payment_service
      - inventory_service

# -------------------------------
# Named Volumes
# -------------------------------
volumes:
  order-db-data:
  payment-db-data:
  inventory-db-data:
  prometheus-data: